# /etc/nginx/sites-available/drs.conf  (then: ln -s ../sites-available/drs.conf /etc/nginx/sites-enabled/)
# HTTPS in front of DRS. DRS listens on 127.0.0.1:8080 ([app] host / port).
# In app.toml: base_url = "https://reports.company.local", [session] cookie_secure = true,
# forwarded_allow_ips = "127.0.0.1".

server {
    listen 80;
    server_name reports.company.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name reports.company.local;

    ssl_certificate     /etc/ssl/certs/reports.company.local.crt;
    ssl_certificate_key /etc/ssl/private/reports.company.local.key;

    # Exports of large reports and slow sources.
    client_max_body_size 10m;
    proxy_read_timeout 900s;   # >= [limits] hard_timeout_seconds
    proxy_send_timeout 900s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # Required: the admin pages compare the browser's Origin with this Host (CSRF defence).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;   # stream exports as they are written
    }
}
