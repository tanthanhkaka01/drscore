# DRS database configuration. Copy to config/database.toml and edit.
# This file alone decides which engine holds the DRS database.

# Which engine holds the DRS database: "sqlite" or "postgresql".
# SQLite is the default: nothing to install, two files under runtime/. Change to "postgresql" and
# fill in [postgresql] when the installation grows (docs/deployment.md); DRS creates its tables
# there at the next start - reports, users and grants are carried over with `metadata export` /
# `metadata import`.
# The environment variable DRS_DB_ACTIVE, when set, overrides this value.
active = "sqlite"

[sqlite]
# Relative paths are relative to the project root.
path = "runtime/drs.sqlite3"
# The BI datasets (reports with a "BI dataset table"), in a file and a folder of their own: the only
# thing a BI tool such as Superset is given to read - never the DRS database above.
bi_path = "runtime/bi/datasets.sqlite3"

[postgresql]
host = "127.0.0.1"
port = 5432
database = "drs"
user = "drs_app"
# Name of the environment variable that holds the password. Never the password itself.
password_env = "DRS_DB_PASSWORD"
# Schema of the DRS tables, and schema of the tables Superset reads.
schema = "drs"
bi_schema = "drs_bi"
sslmode = "prefer"
pool_size = 5
max_overflow = 5
